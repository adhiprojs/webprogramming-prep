<!DOCTYPE html>
<html>

  </fieldset>
  <fieldset>

  <button id="pollResetBtn">Reset</button>
  <p id="ageDisplay"></p>
  <p id="genreCount">0</p>
  <script src="script.js"></script>
</body>
</html>
