<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <form id="userForm">
    <input id="name">
    <p id="nameError" class="d-none">Enter your name</p>
    <input id="email">
    <p id="emailError" class="d-none">Enter a valid .com email</p>
    <input id="age">
    <p id="ageError" class="d-none">Age must be 18 to 120</p>
    <button type="submit">Submit</button>
  </form>
  <div id="successMessage" class="d-none">
    <p id="successData"></p>
  </div>
  <script src="script.js"></script>
</body>
</html>
