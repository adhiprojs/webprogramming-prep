<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .profile-card {
            width: 250px;
            margin: 40px auto;
            padding: 20px;
            text-align: center;
            background-color: #ffffff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            border-radius: 8px;
        }

        .profile-card .button {
            display: inline-block;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            color: #ffffff;
            background-color: #4cae4f;
            text-decoration: none;
            cursor: pointer;
        }

        .profile-card .button:hover {
            background-color: #45aa3f;
        }
    </style>
</head>
<body>
    <div class="profile-card">
        <h2>John Doe</h2>
        <p>Web Developer</p>
        <a href="#" class="button">Contact</a>
    </div>
</body>
</html>
