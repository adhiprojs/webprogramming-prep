<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layered Image Showcase</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="showcase">
    <div class="buttons">
      <button id="btn1" class="btn btn-primary">Image 1</button>
      <button id="btn2" class="btn btn-success">Image 2</button>
      <button id="btn3" class="btn btn-danger">Image 3</button>
    </div>

    <div class="image-container">
      <img id="img1" class="layered-img" src="img1.svg" alt="Image 1">
      <img id="img2" class="layered-img" src="img2.svg" alt="Image 2">
      <img id="img3" class="layered-img" src="img3.svg" alt="Image 3">
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
