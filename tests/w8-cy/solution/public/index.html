<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suresh's Kids' Sketch Pad</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <canvas id="sketchPad" width="500" height="300"></canvas>

  <div class="content">
    <h2>Suresh's Kids' Sketch Pad</h2>

    <div class="controls">
      <button id="defaultBtn">Default</button>
      <button id="redBtn">Red</button>
      <button id="blueBtn">Blue</button>
      <button id="greenBtn">Green</button>
      <button id="eraserBtn">Eraser</button>
      <button id="clearBtn">Clear Canvas</button>
    </div>

    <div id="currentColorDisplay">
      Current Drawing Color: <span id="currentColor">Black</span>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
