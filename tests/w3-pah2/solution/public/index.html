<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delicious Restaurant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Delicious Restaurant</h1>
        <nav>
            <a href="#">Home</a>
            <a href="#">Menu</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <div class="container">
        <h2 class="section-title">Starters</h2>
        <div class="item">
            <span class="name">Soup</span>
            <span class="price">$5</span>
        </div>
        <div class="item">
            <span class="name">Salad</span>
            <span class="price">$6</span>
        </div>
        <h2 class="section-title">Main Course</h2>
        <div class="item">
            <span class="name">Pasta</span>
            <span class="price">$12</span>
        </div>
        <div class="item">
            <span class="name">Pizza</span>
            <span class="price">$14</span>
        </div>
        <h2 class="section-title">Desserts</h2>
        <div class="item">
            <span class="name">Ice Cream</span>
            <span class="price">$4</span>
        </div>
        <div class="item">
            <span class="name">Cake</span>
            <span class="price">$6</span>
        </div>
    </div>

    <footer>
        <p>Open daily from 10 AM to 10 PM</p>
    </footer>
</body>
</html>
